<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon espace</title>
  <style>
    :root {
      /* Zone de Grist à masquer (en px) : à ajuster si l'interface change */
      --haut: 53px;    /* titre de la vue + icônes filtre / menu */
      --bas: 25px;
      --gauche: 26px;  /* bordure verte */
      --droite: 26px;  /* si la barre de défilement est rognée, essayer 10px */

      /* Marge de protection autour du contenu (0 sur grand écran) */
      --marge: 0px;
      --marge-haut: 0px;
    }

    /* Petits écrans : on remet une marge pour que le contenu ne touche pas les bords */
    @media (max-width: 700px) {
      :root {
        --marge: 16px;
        --marge-haut: 24px;
      }
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    .cadre {
      box-sizing: border-box;
      height: 100vh;  /* repli pour les navigateurs anciens */
      height: 100dvh; /* hauteur réelle sur mobile */
      padding: var(--marge-haut) var(--marge) 0;
    }

    .fenetre {
      position: relative;
      height: 100%;
      overflow: hidden;
    }

    .fenetre iframe {
      position: absolute;
      top: calc(-1 * var(--haut));
      left: calc(-1 * var(--gauche));
      width: calc(100% + var(--gauche) + var(--droite));
      height: calc(100% + var(--haut) + var(--bas));
      border: 0;
    }
  </style>
</head>
<body>
  <div class="cadre">
    <div class="fenetre">
      <iframe id="cadre-grist" title="Mon espace"></iframe>
    </div>
  </div>
<script>

</script>
</body>
</html>
